<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}KAAP Bank{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <a href="/" class="brand">
            <span class="brand-icon">N</span>

            <div>
                <strong>KAAP BANK</strong>
                <small>Transaction Management</small>
            </div>
        </a>


        <div class="nav-links">

            <a href="/" class="nav-link">Dashboard</a>

            <a href="/customers" class="nav-link">
                Customers
            </a>

            <a href="/accounts" class="nav-link">
                Accounts
            </a>

            <a href="/transfer" class="nav-link">
                Transfers
            </a>

            <a href="/transactions" class="nav-link">
                Transactions
            </a>

            <a href="/transaction-control" class="nav-link">
                Transaction Control
            </a>

        </div>

    </nav>


    <!-- Page Content -->

    <main>
        {% block content %}
        {% endblock %}
    </main>


    <!-- Footer -->

    <footer>

        <p>
            KAAP BANK — Bank Transaction Management System
        </p>

        <p>
            DBMS Application Project
        </p>

    </footer>

</body>

</html>
